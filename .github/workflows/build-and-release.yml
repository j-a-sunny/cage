name: Build and Release

on:
  push:
    branches: [ waydroid-helper ]
  pull_request:
    branches: [ waydroid-helper ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install \
          build-essential \
          g++ \
          ninja-build \
          python3-pip \
          python3-venv \
          libxkbcommon-dev \
          libegl-dev \
          libgbm-dev \
          libgles2-mesa-dev \
          libudev-dev \
          libseat-dev \
          libinput-dev \
          libexpat1-dev \
          libcap-dev \
          libsystemd-dev \
          libmtdev-dev \
          libevdev-dev \
          libwacom-dev \
          libgudev-1.0-dev \
          libglib2.0-dev \
          libffi-dev \
          libpcre2-dev \
          mesa-common-dev \
          libxcb1-dev \
          libxcb-render0-dev \
          libxcb-render-util0-dev \
          libxcb-util-dev \
          libxcb-dri3-dev \
          libxcb-present-dev \
          libxcb-shm0-dev \
          libxcb-xfixes0-dev \
          libxcb-xinput-dev \
          libx11-dev \
          libx11-xcb-dev \
          liblzma-dev \
          libvulkan-dev \
          vulkan-tools \
          spirv-tools \
          glslang-tools

    - name: Setup Python venv and install meson
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install meson
        echo "$GITHUB_WORKSPACE/venv/bin" >> $GITHUB_PATH

    - name: Build with meson
      run: |
        meson setup build \
          --default-library=static \
          --prefer-static \
          --buildtype=debug \
          -Dwerror=false \
          -Dc_link_args='-lstdc++' \
          -Dwlroots:backends=libinput,x11
        meson compile -C build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: cage-waydroid-helper-${{ matrix.arch }}
        path: build/cage

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/waydroid-helper'

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Get current timestamp
      id: timestamp
      run: echo "timestamp=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

    - name: Prepare release files
      run: |
        mkdir -p release
        mv cage-waydroid-helper-amd64/cage release/cage-waydroid-helper_${{ steps.timestamp.outputs.timestamp }}_amd64
        mv cage-waydroid-helper-arm64/cage release/cage-waydroid-helper_${{ steps.timestamp.outputs.timestamp }}_arm64

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: release-${{ steps.timestamp.outputs.timestamp }}
        name: "${{ steps.timestamp.outputs.timestamp }}"
        files: release/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Checkout code for flake update
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}

    - name: Update package.nix checksums
      run: |
        VERSION="${{ steps.timestamp.outputs.timestamp }}"
        HASH_AMD64=$(sha256sum release/cage-waydroid-helper_${VERSION}_amd64 | awk '{print $1}' | xxd -r -p | base64)
        HASH_ARM64=$(sha256sum release/cage-waydroid-helper_${VERSION}_arm64 | awk '{print $1}' | xxd -r -p | base64)
        
        SRI_AMD64="sha256-${HASH_AMD64}"
        SRI_ARM64="sha256-${HASH_ARM64}"
        
        sed -i -e "s|version = \".*\";|version = \"${VERSION}\";|" package.nix
        
        awk -v amd="$SRI_AMD64" -v arm="$SRI_ARM64" '
          /x86_64-linux = \{/ { in_x86 = 1 }
          /aarch64-linux = \{/ { in_arm = 1 }
          in_x86 && /hash =/ { sub(/hash = ".*"/, "hash = \"" amd "\""); in_x86 = 0 }
          in_arm && /hash =/ { sub(/hash = ".*"/, "hash = \"" arm "\""); in_arm = 0 }
          { print }
        ' package.nix > package.nix.tmp && mv package.nix.tmp package.nix

    - name: Commit and push flake update
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add package.nix
        git commit -m "Update flake checksums for release-${{ steps.timestamp.outputs.timestamp }} [skip ci]"
        git push